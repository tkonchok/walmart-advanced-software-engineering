name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test with Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: |
          mkdir -p out/ci
          javac -Xlint:all \
            -d out/ci \
            power-of-two-max-heap/src/PowerOfTwoMaxHeap.java \
            power-of-two-max-heap/test/PowerOfTwoMaxHeapTest.java \
            power-of-two-max-heap/test/PowerOfTwoMaxHeapRandomizedTest.java \
            power-of-two-max-heap/benchmark/PowerOfTwoMaxHeapBenchmark.java

      - name: Run deterministic tests
        run: java -cp out/ci PowerOfTwoMaxHeapTest

      - name: Run randomized tests
        run: java -cp out/ci PowerOfTwoMaxHeapRandomizedTest
